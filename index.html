<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AlexNot: the paper</title>
<!-- GitHub Pages can't send a real HTTP redirect, so: an instant meta refresh (search engines treat a 0-second one like a permanent redirect)... -->
<meta http-equiv="refresh" content="0; url=https://drive.google.com/file/d/1JBSRgYK2pq_FyCNBUVIEm6dO_1-xNqrD/view?usp=sharing">
<!-- ...plus a canonical link, telling search engines the "real" page is the target... -->
<link rel="canonical" href="https://drive.google.com/file/d/1JBSRgYK2pq_FyCNBUVIEm6dO_1-xNqrD/view?usp=sharing">
<!-- ...plus JS, which also keeps this page out of the back-button history -->
<script>location.replace("https://drive.google.com/file/d/1JBSRgYK2pq_FyCNBUVIEm6dO_1-xNqrD/view?usp=sharing");</script>
</head>
<body>
<!-- Only seen if redirects are blocked -->
<p>Redirecting to the AlexNot paper… <a href="https://drive.google.com/file/d/1JBSRgYK2pq_FyCNBUVIEm6dO_1-xNqrD/view?usp=sharing">click here if nothing happens</a>.</p>
</body>
</html>
